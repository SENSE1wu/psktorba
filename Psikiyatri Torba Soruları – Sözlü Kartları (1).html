<h1>Psikiyatri torba soruları</h1><p class="s">Karta dokun → cevabı gör. “Bildim” ile işaretle, ilerleme tarayıcında kalır.</p>
<div id="pb"><i></i></div><div class="row" id="tp"></div>
<div class="row"><button id="sh">Karıştır</button><button id="hk" aria-pressed="false">Bildiklerimi gizle</button><button id="rs">Sıfırla</button></div>
<div id="c"><div id="t"></div><div id="q"></div><div id="a" hidden></div><div id="h">Cevap için dokun</div></div>
<div class="n"><button id="pv">← Önceki</button><span id="ct" class="s"></span><button id="kn">Bildim ✓</button><button id="nx">Sonraki →</button></div>
</main><script>
const D=[
["Alkol & madde","Alkol kesilmesinde müdahale?","<b>Hafif-orta:</b> oral detoks – diazepam 4×10 mg (veya klordiazepoksit 4×25 mg), 2-3 haftada azaltarak kes; tiamin 100 mg + multivitamin (B, C, folat).<br><b>Ciddi KC yetmezliği:</b> lorazepam 1–2,5 mg (10 mg diazepam ≈ 1 mg lorazepam).<br><b>Ağır/deliryum/dehidratasyon:</b> yatış, monitör, sıvı-elektrolit; IV detoks (diazepam 20–40 mg/gün; KC bozuksa lorazepam 6–12 mg/gün), 5-7 günde bitir, PO ile 1-2 hafta azalt. Ajitasyonda haloperidol ek."],
["Alkol & madde","Alkol kesilmesinde konvülsiyon ne zaman, müdahale?","Genelde ilk <b>48 saat</b> (6–72 saat). Diazepam 5–10 mg IV veya lorazepam 1–2 mg IV; tekrarlarsa <b>fenitoin 20 mg/kg IV</b>."],
["Alkol & madde","Deliryum tremens: belirti ve tedavi?","Kesmeden 48–72 saat sonra: bilinç bulanıklığı, dezoryantasyon, <b>canlı görsel varsanı (küçük hayvanlar)</b>, ajitasyon + otonomik (taşikardi, HT, ateş, terleme, tremor). Acil.<br>Tedavi: yoğun izlem, sıvı-elektrolit, tiamin, yüksek doz diazepam (20–60 mg/gün, sonra azalt), ajitasyonda haloperidol, sakin ortam."],
["Alkol & madde","Alkol kesilmesinde hastaneye yatış endikasyonları?","DT öyküsü, kesilmeye bağlı nöbet, çok şiddetli belirti, eşlik eden fiziksel/ruhsal hastalık, intihar riski, yetersiz sosyal destek."],
["Alkol & madde","Bağımlılık tanı ölçütleri?","Davranış repertuarının daralması • tolerans • kesilme belirtileri • kesilmeyi gidermek için kullanım • zorlantılı kullanım (aşerme) • madde arama davranışı • bıraktıktan sonra yeniden başlama."],
["Alkol & madde","Bağımlılık risk faktörleri?","<b>Madde:</b> etki süresi/şiddeti, ulaşılabilirlik. <b>Kişi:</b> yapısal ve ruhsal özellikler. <b>Çevre:</b> akran grubu, aile, toplumsal çevre."],
["Alkol & madde","Opioid kesilme belirtileri?","Eroin, kodein, metadon… Yaygın kas-eklem ağrısı, abdominal kramp, sulanma, rinore, midriyazis, ishal, bulantı-kusma, esneme, üşüme, anksiyete, uykusuzluk. <b>Ölüm riski taşımaz.</b>"],
["Alkol & madde","Esrar bağımlılığı?","THC (anandamid/CB1 reseptörleri); lipofilik → vücutta ~30 gün kalır. Bağımlılık yapar (kesilme hafif). Şizofreni riskini ~2 kat artırır. Depersonalizasyon, derealizasyon, bilişsel-psikomotor yavaşlama (hipokampus). Kesilme: anksiyete, huzursuzluk, uykusuzluk, iştahsızlık, paranoid düşünce. Başka maddelere kapı açar."],
["Deliryum & demans","Deliryum: tanım, nedenler, tedavi?","Ani başlangıçlı, dalgalı <b>bilinç/dikkat bozukluğu</b>, dezoryantasyon, varsanı, uyku-uyanıklık bozulur; genelde geri dönüşümlü.<br>Neden: ilaç, enfeksiyon, hipoksi, metabolik/endokrin, SSS lezyonu, idrar-feçes retansiyonu, dehidratasyon. Tedavi: <b>önce nedeni bul-tedavi et</b>, ortam düzenle, gerekirse düşük doz haloperidol."],
["Deliryum & demans","Deliryum ile demans farkı?","Deliryum: ani, dalgalı, bilinç bozuk, günler-haftalar. Demans: sinsi, ilerleyici, bilinç açık, kalıcı."],
["Deliryum & demans","Alzheimer – frontotemporal – vasküler demans?","<b>Alzheimer:</b> sinsi, yakın bellek, amiloid plak + nörofibriler yumak, limbik→yaygın.<br><b>FTD:</b> 40-50 yaş, kişilik/davranış değişikliği, dezinhibisyon, apati; bellek geç bozulur; tedavisi yok, otozomal dominant geçiş olabilir.<br><b>Vasküler:</b> ani, basamak tarzı kötüleşme, fokal nörolojik bulgu."],
["Deliryum & demans","Lewy cisimcikli demans: 3 özellik?","1) Erken, canlı görsel varsanılar 2) Çok düşük doz nöroleptikle bile ekstrapiramidal bulgu 3) Bilişsel dalgalanma."],
["Deliryum & demans","Demans ile depresyon (psödodemans) farkı?","Depresyon: şikâyet eder, “bilmiyorum” der, antidepresan/EKT’ye yanıt var. Demans: gizler/fark etmez, ilerleyici, yanıt yok."],
["Deliryum & demans","Geri dönüşümlü demans nedenleri?","B12/folat eksikliği, hipotiroidi, normal basınçlı hidrosefali, subdural hematom, tümör, nörosifiliz/HIV, depresyon (psödodemans), ilaç/alkol."],
["Deliryum & demans","Wernicke ve Korsakoff?","Tiamin (B1) eksikliği, alkolizm. <b>Wernicke:</b> konfüzyon, ataksi, oftalmopleji/nistagmus – acil IV tiamin. <b>Korsakoff:</b> anterograd+retrograd amnezi, konfabülasyon."],
["Duygudurum","Mani ve hipomani tanı ölçütleri?","≥1 hafta yükselmiş/irritabl duygudurum + ≥3 (irritabl ise ≥4): büyüklük, uyku ihtiyacı↓, konuşma çokluğu, fikir uçuşması, distraktibilite, amaca yönelik aktivite↑, riskli davranış. İşlevsellik bozulur/yatış gerekir.<br><b>Hipomani:</b> 4 gün, işlevsellik bozulmaz, psikoz/yatış yok."],
["Duygudurum","Bipolar bozukluk tipleri?","Tip 1: depresyon+mani (erkekte fazla). Tip 2: depresyon+hipomani (kadında fazla). Miks: aynı atakta mani+depresyon. Siklotimi: hipomani ↔ distimi."],
["Duygudurum","Depresyon belirtileri ve tanı?","≥2 hafta + işlevsellik bozulması: çökkün duygudurum, anhedoni, enerji↓, psikomotor yavaşlama/ajitasyon, uyku/iştah/libido değişikliği, suçluluk, umutsuzluk, konsantrasyon↓, intihar düşüncesi. Psikotik depresyonda mikromanik/nihilistik/paranoid sanrı, aşağılayıcı işitsel varsanı."],
["Duygudurum","Beck bilişsel üçlü?","Kendini, yaşadığı olayları/dünyayı ve geleceği olumsuz değerlendirme."],
["Duygudurum","Duygudurum ve duygulanım farkı?","<b>Duygudurum (mood):</b> uzun süreli genel duygusal tutum (çökkün, öforik, irritabl). <b>Duygulanım (affect):</b> anlık, gözlenen tepki (künt, düz, sığ, labil, uygunsuz)."],
["Farmakoloji","Lityum: kan düzeyi, yan etki, toksisite?","Terapötik 0,6–1,2 mEq/L (akut mani 0,8–1,2; idame 0,6–0,8); >1,5 toksik. Kan 12 saat sonra, 5. günde.<br>Yan etki: tremor, poliüri-polidipsi, kilo, hipotiroidi, bulantı. Öncesi: böbrek, tiroid, EKG, gebelik testi.<br>Toksisite: kaba tremor, ataksi, konfüzyon → kes, hidrasyon, hemodiyaliz."],
["Farmakoloji","Valproat, karbamazepin, lamotrijin yan etkileri?","<b>Valproat:</b> bulantı, kilo, tremor, saç dökülmesi, hepatotoksisite, pankreatit, trombositopeni, nöral tüp defekti.<br><b>Karbamazepin:</b> sedasyon, diplopi, ataksi, hiponatremi, agranülositoz, SJS, CYP indüksiyonu.<br><b>Lamotrijin:</b> SJS/TEN (döküntü); valproatla doz yarıya, karbamazepinle iki katına."],
["Farmakoloji","SSRI’lar, endikasyon, yan etki?","Fluoksetin, paroksetin, sertralin, sitalopram, essitalopram, fluvoksamin. Depresyon, panik, OKB, sosyal fobi, TSSB, bulimia.<br>Yan etki: bulantı, ajitasyon, uykusuzluk, cinsel işlev bozukluğu (ejakülasyon gecikmesi, anorgazmi), kesilme sendromu. Yüksek dozda <b>serotonin sendromu</b>: ajitasyon, ateş, tremor, miyokloni, ishal, otonomik instabilite."],
["Farmakoloji","Antipsikotik etki mekanizması ve yan etkiler?","<b>D2 blokajı:</b> mezolimbik → tedavi edici; mezokortikal → negatif belirti artışı; nigrostriatal → EPS; tuberoinfundibular → prolaktin↑ (galaktore, amenore, jinekomasti, libido↓).<br>M1 → antikolinerjik; H1 → sedasyon, kilo; α1 → ortostatik hipotansiyon, refleks taşikardi. Atipikte 5-HT2A blokajı EPS ve prolaktini azaltır."],
["Farmakoloji","Ekstrapiramidal yan etkiler ve tedavisi?","Akut distoni (saat-gün), parkinsonizm, akatizi; geç: tardif diskinezi/distoni.<br>Boyun-gövde kasılması = <b>akut distoni</b> → IM biperiden (akineton) veya difenhidramin 50 mg. Parkinsonizm: antikolinerjik, doz↓. Akatizi: propranolol/BZD."],
["Farmakoloji","Malin nöroleptik sendrom?","Antipsikotik sonrası: <b>ateş, kas rijiditesi, otonomik instabilite, bilinç değişikliği</b>, CK↑, lökositoz. Tedavi: ilacı kes, destek, dantrolen/bromokriptin, BZD. Acil."],
["Farmakoloji","Atipik antipsikotik yan etkileri, klozapin?","Metabolik sendrom/kilo (olanzapin, klozapin), QT uzaması (ziprasidon, sertindol), hiperprolaktinemi (risperidon).<br><b>Klozapin:</b> dirençli şizofreni tek ilacı; agranülositoz (kan sayımı), nöbet, sialore, miyokardit."],
["Farmakoloji","Eksite hastayı yatıştırma (oral/parenteral)?","<b>Oral:</b> lorazepam 2,5 mg, diazepam 10 mg, haloperidol 5 mg, klorpromazin 100 mg.<br><b>IM kokteyl:</b> klorpromazin 25 mg + haloperidol 5 mg + biperiden 5 mg; yarım saatte başlar, birkaç saat sürer.<br>Günlerce: <b>Clopixol Acuphase</b> (zuklopentiksol) – 3-4 saatte başlar, 3-4 gün sürer; ilaç reddinde depo ile karıştırılabilir."],
["Farmakoloji","Benzodiazepinlerin etkisi ve dikkat edilecekler?","GABA-A Cl⁻ kanalı açılımı↑ → hiperpolarizasyon. Anksiyolitik, sedatif, hipnotik, antikonvülsan, miyorelaksan. Yan etki: sedasyon, ataksi, amnezi; tolerans/bağımlılık, alkolle tehlikeli. KC hastalığında lorazepam. Buspiron: 5-HT1A parsiyel agonist, ~3 haftada etki."],
["Psikoz & şizofreni","Pozitif belirtiler?","<b>Sanrı</b> (bizar: etkilenme, düşünce yayılması/çalınması/sokulması; nonbizar: persekütuvar, kıskançlık, referans…), <b>varsanı</b> (en sık işitsel: emreden, yorum yapan), <b>dezorganize konuşma</b> (fikir uçuşması, laf salatası, neolojizm, teğetsellik), <b>dezorganize/katatonik davranış</b>."],
["Psikoz & şizofreni","Negatif belirtiler?","Affekt sığlaşması/künt, aloji, avolüsyon, anhedoni, sosyal-duygusal içe çekilme, dikkat bozukluğu, bakım azalması. Ayırıcı tanıda en çok depresyonla karışır."],
["Psikoz & şizofreni","Şizofreni klinik tipleri?","Paranoid (sanrı-varsanı belirgin), dezorganize/hebefrenik (dezorganizasyon, affekt donukluğu), katatonik, ayrışmamış, rezidüel (belirtiler silik)."],
["Psikoz & şizofreni","Şizofreniform bozukluk – şizofreni farkı?","Süre: şizofreniform ≥1 ay, <6 ay; şizofreni >6 ay. Şizofreniformda işlevsellik düzelir, prognoz genelde daha iyi."],
["Psikoz & şizofreni","Paranoid bozukluk – paranoid şizofreni?","Paranoid bozukluk: nonbizar, sistematize sanrı, işlevsellik ve duygulanım sağlam. Paranoid şizofreni: bizar sanrı, dezorganizasyon, işlevsellik bozuk."],
["Psikoz & şizofreni","Katatoni belirtileri?","Stupor, mutizm, balmumu esnekliği, negativizm, postür, stereotipi, ekolali/ekopraksi, eksitasyon. Neden: şizofreni, duygudurum, organik, ilaç. Tedavi: lorazepam, EKT."],
["Psikoz & şizofreni","Şizofreni nörobiyolojisi?","<b>Dopamin hipotezi:</b> mezolimbik aşırı aktivite → pozitif; mezokortikal azlık → negatif. Amfetamin psikoz yapar; BOS’ta HVA↑. Ayrıca ventrikül genişlemesi, gri cevher azalması; genetik; serotonin/glutamat rolü."],
["Psikoz & şizofreni","Şizofreni tedavisi?","Antipsikotik (atipik tercih; dirençte klozapin); EKT (direnç, katatoni, suisidal); psikososyal: bireysel/grup terapisi, sosyal beceri eğitimi, rehabilitasyon, aile-hasta dernekleri."],
["Anksiyete & nevroz","Panik atak – panik bozukluk?","<b>Atak:</b> ani, 10 dk’da zirve, ≥4: çarpıntı, terleme, titreme, nefes darlığı, göğüs ağrısı, bulantı, baş dönmesi, derealizasyon, ölüm/çıldırma korkusu, parestezi. <b>Bozukluk:</b> tekrarlayan atak + ≥1 ay beklenti anksiyetesi/davranış değişikliği. Atak: BZD; idame SSRI/TCA."],
["Anksiyete & nevroz","Yaygın anksiyete bozukluğu?","≥6 ay, kontrol edilemeyen yaygın kaygı + kas gerginliği, huzursuzluk, yorgunluk, konsantrasyon↓, irritabilite, uyku bozukluğu, otonomik belirtiler. Tedavi: SSRI/SNRI, buspiron, kısa süreli BZD, BDT."],
["Anksiyete & nevroz","OKB: obsesyon ve kompulsiyon?","Obsesyon: girici, tekrarlayıcı, benliğe yabancı düşünce/dürtü → anksiyete. Kompulsiyon: anksiyeteyi azaltan ritüel. Gerçeği değerlendirme sağlam. Tedavi: SSRI/klomipramin + maruz bırakma. OKKB’den farkı: OKKB’de gerçek obsesyon-kompulsiyon yoktur."],
["Anksiyete & nevroz","Sosyal fobi?","Başkalarınca değerlendirilme korkusu, kaçınma, kızarma-titreme; başlangıç 13–19 yaş. Panik atakları sosyal ortamla sınırlı, güvenilir kişi yarar sağlamaz (agorafobiden farkı). Tedavi: SSRI, performans için propranolol, BDT."],
["Anksiyete & nevroz","TSSB?","Aşırı travmatik olay sonrası: olayı yeniden yaşama, kaçınma, aşırı uyarılmışlık, uyku bozukluğu, irritabilite. >1 ay. Tedavi: SSRI + travma odaklı terapi."],
["Anksiyete & nevroz","Konversiyon, simülasyon, hipokondriazis?","<b>Konversiyon:</b> ego anksiyeteyi organ işlev kaybına (felç, afoni, körlük) dönüştürür; bilinçdışı, stresle ilişkili, geri dönüşümlü, güzel aldırmazlık. Primer kazanç: anksiyeteden kurtulma; sekonder: çevrenin ilgisi. <b>Simülasyon bilinçli ve amaçlıdır.</b><br><b>Hipokondriazis:</b> somatoform, hastalık korkusu; inanç sanrı düzeyinde değildir (sanrıda ikna olmaz). Tedavi: psikoterapi + anksiyolitik."],
["Anksiyete & nevroz","Derealizasyon – depersonalizasyon?","Depersonalizasyon: kendine yabancılaşma; derealizasyon: dış dünyaya yabancılaşma. Gerçeği değerlendirme sağlam (somatik sanrıdan farkı)."],
["Yeme & davranış","Anoreksiya nervoza?","Normal kiloyu reddetme, kilo almaktan korku, beden algısı bozukluğu, amenore. K/E 10–20/1, ergenlikte başlar. Bulgu: kaşeksi, lanugo, bradikardi, QT uzaması, osteoporoz, lökopeni/anemi, LH-FSH-T3↓, kolesterol↑, üre↑. Ayırıcı: kanser, GİS hastalığı, depresyon, bulimia."],
["Yeme & davranış","Bulimia nervoza?","Tıkınırcasına yeme + telafi (kusma, laksatif, aşırı egzersiz), beden imajı takıntısı; kilo normal. Hipokalemi, hipokloremi, BUN↑, parotis büyümesi, adet düzensizliği. SSRI (fluoksetin) etkili."],
["Yeme & davranış","DEHB?","Gelişim düzeyine uymayan dikkatsizlik, dürtüsellik, aşırı hareketlilik; kronik, erkekte sık. 3 tip: dikkatsizlik ön planda, hiperaktivite-dürtüsellik ön planda, bileşik. Tedavi: metilfenidat, atomoksetin, eğitim/psikoterapi."],
["Yeme & davranış","Davranım bozukluğu?","Başkalarının haklarını ve yaşa uygun kuralları sürekli çiğneme: saldırganlık, kavga, silah kullanma, hayvanlara/insanlara acımasızlık, hırsızlık, mala zarar, evden kaçma. Erkekte 4–12 kat fazla."],
["Kişilik","Antisosyal, narsistik, C kümesi kişilik bozuklukları?","<b>Antisosyal:</b> norm/yasalara uymama, yalan, hırsızlık; mahkûmların ~%75’i; 40 yaştan sonra stabilizasyon. <b>Narsistik:</b> grandiyözite. <b>C kümesi:</b> bağımlı, kaçıngan, OKKB – ortak: anksiyöz oluş. Paranoid KB: yansıtma, inkâr, rasyonalizasyon."],
["Cinsellik & uyku","Cinsel siklus ve CİB sınıflaması?","4 basamak: uyarılma, plato, orgazm, çözülme (+refrakter); 3 faz: istek, uyarılma, orgazm. CİB bu fazlara göre: istek (azalma), uyarılma (erektil disfonksiyon, lubrikasyon), orgazm (anorgazmi, prematür/retarde ejakülasyon), ağrı (disparoni, vajinismus). Birincil: hiç işlev görmemiş; ikincil: işlev görmüş sonra bozulmuş."],
["Cinsellik & uyku","Prematür ejakülasyon, vajinismus?","<b>PE:</b> minimal uyaranla isteğinden önce boşalma; en sık erkek CİB (~%30). SSRI (boşalmayı geciktirir), stop-start, squeeze.<br><b>Vajinismus:</b> vajen dış 1/3’te istemsiz kasılma, birleşme olmaz; travma bağlı olabilir. Kegel/dilatör, kademeli duyarsızlaştırma, kadın üstte pozisyon, lubrikan."],
["Cinsellik & uyku","Parafili?","Nesne/kendini veya partneri aşağılama/acı ile yinelayen yoğun dürtü-fantezi-davranış; sıkıntı yaratıyorsa tanı. Ekshibisyonizm, fetişizm, frotörizm, pedofili, mazoşizm, sadizm, voyörizm. Tedavi: psikoterapi, antiandrojen, SSRI."],
["Cinsellik & uyku","REM – NREM?","<b>REM</b> (%25): hızlı göz hareketi, beta benzeri dalga, atoni, hikâyeli rüya, ereksiyon, termoregülasyon yok; bozukluklar sabaha karşı. <b>NREM</b> (%75): evre 1-4, 3-4 yavaş dalga (delta), senkronize; bozukluklar gecenin ilk yarısı."],
["Cinsellik & uyku","Gece terörü – kabus?","<b>Gece terörü:</b> NREM, çığlıkla uyanma, terleme, iletişim kurulamaz, telkinle sakinleşmez, sabah amnezi. <b>Kabus:</b> REM, uyanınca iletişim kurar, rüyayı hatırlar ve anlatır."],
["Cinsellik & uyku","İnsomnia tedavisi?","Tanım: ≥1 ay, haftada ≥3. Önce doğru tanı (sirkadyen bozukluktan ayır), primer/sekonder; sekonderde nedeni tedavi et. <b>Uyku hijyeni:</b> yatak yalnız uyku/cinsellik için, düzenli saat, kafein/alkolden uzak, aç-tok yatma, gevşeme. Olmazsa kısa-etkili BZD (alprazolam, lorazepam) / zopiklon, ufak doz antihistaminik."],
["Psikodinamik & terapi","İd, ego, süperego?","<b>İd:</b> en eski, dürtü deposu, haz ilkesi, birincil süreç. <b>Ego:</b> gerçeklik ilkesi, ikincil süreç; dürtü kontrolü, gerçekle ilişkiler, nesne ilişkileri, sentez, savunma. <b>Süperego:</b> en son gelişir, vicdan-ahlak; ödipal çatışma çözülürken oluşur."],
["Psikodinamik & terapi","Savunma mekanizmaları?","Bastırma, inkâr, yansıtma, çözülme, gerileme, yer değiştirme, yalıtma, yapma-bozma, dönüştürme, karşıt tepki, rasyonalizasyon, entelektüalizasyon, yüceltme.<br>Bastırma: çatışmalı dürtü/anıyı bilinç dışına itme. Yansıtma: kendi dürtüsünü başkasına atfetme (paranoid sanrı). Yer değiştirme: duyguyu asıl nesneden başka nesneye yöneltme (fobi). Yapma-bozma: olumsuz eylemi nötrleştirme (OKB, tahtaya vurma)."],
["Psikodinamik & terapi","Psikoterapi sınıflaması, operan koşullanma?","Yeniden yapılandırıcı (psikanaliz, psikanalitik terapi) • destekleyici (rehberlik, ortam, uğraş, sosyal beceri) • yeniden öğrenme (davranış, bilişsel, aile).<br><b>Operan koşullanma:</b> davranışın sonucu davranışı pekiştirir/söndürür; davranış tedavilerinin temeli."],
["Psikodinamik & terapi","Terapide direnç; psikanalitik psikoterapi?","<b>Direnç:</b> bilinçdışının ortaya çıkmasını engelleme (geç kalma, unutma, susma, aynı konuyu tekrarlama). <b>Psikanalitik psikoterapi:</b> psikanalizden kısa, güncel çatışma odaklı, serbest çağrışım yerine karşılıklı görüşme; içgörü hedeflenir; depresyon, anksiyete, KB’de."],
["Psikodinamik & terapi","Biyopsikososyal model, DSM çok eksenli?","Hastalık biyolojik, psikolojik ve sosyal etmenlerin etkileşimidir. DSM-IV eksenler: I klinik bozukluk, II kişilik bozukluğu/zeka geriliği, III genel tıbbi durum, IV psikososyal sorunlar, V GAF."],
["İntihar","İntihar girişimi sonrası acil yaklaşım?","Önce tıbbi stabilizasyon (ilaç içtiyse mide yıkama). Sakin, yargılamadan dinle, empati; ölüm düşüncesini açıkça konuş, öğüt verme. Risk: plan, yöntem, ölümcüllük, hazırlıklar (vasiyet). Aracı uzaklaştır, yalnız bırakma, psikiyatriye yönlendir/yatış."],
["İntihar","İntihar risk ve koruyucu etmenler?","Risk: depresyon, şizofreni, alkol-madde, borderline/antisosyal KB, organik (demans). Girişim: kadın, genç; <b>tamamlanmış:</b> erkek, yaşlı, dul/boşanmış, yalnız, işsiz. Koruyucu: aile-sosyal destek, gebelik, çocuk sahibi olma, dini inanç, intihara karşı kültür."],
["Adli","TCK yaş küçüklüğü, isnat yeteneği?","<12 yaş: ceza ehliyeti yok. 12–15: <b>fark gücü</b> (ayırt etme) ve sonucu öngörme muayenesi ile karar. 15–18: indirim. ≥18 tam. Akıl hastalığında şuuru tamamen kaldıran durumda ceza verilmez.<br><b>İsnat yeteneği:</b> anlama + isteme yeteneği; suçun manevi unsuru için şart."],
["Adli","Bilirkişi?","Mahkemenin uzmanlık gerektiren konuda görüşüne başvurduğu kişi; görüşü delildir. Davete uymak zorunda. Tanıktan farkı: olayı görmemiştir, verilerden yorum yapar. Yetkisi: dosyayı inceleme, tanık/sanık dinlenirken hazır bulunup soru sorma."],
["Genel","Genel görünümden tanı ipuçları?","Yaşlı görünüm: Alzheimer, depresyon, kronik şizofreni, alkol; genç görünüm: mani, histrionik. Kilolu: atipik depresyon; zayıf: AN, depresyon, madde. Özbakım↑: mani, OKKB, narsistik; ↓: demans, depresyon, şizofreni. Garip kıyafet: mani, şizofreni. Hareket bozukluğu: Parkinson, Huntington, tardif diskinezi."],
["Genel","Stigma ve etkisi?","Ruhsal hastalığın zayıflık/utanç sayılması. Sonuç: doktora gitmeme, paylaşamama, tedaviye yanıt olacağına inanmakta zorluk."],
["Genel","Eksitasyon nedir, hangi tablolarda görülür?","Davranış ve hareketliliğin aşırı artması; hasta çevreye sözel/fiziksel gözdağı verebilir (küfür, uygunsuz hareket) ya da iletişimi reddedebilir (katatonik eksitasyon). Emir verici işitsel varsanılar olabilir.<br><b>Nedenler:</b> şizofrenik eksitasyon, manik eksitasyon, akut organik beyin sendromları, alkol/madde entoksikasyonu veya yoksunluğu.<br>Gerekirse tespit edilir ama hasta <b>asla yalnız bırakılmaz</b>, solunum-dolaşım izlenir. <b>Ajitasyondan farkı:</b> ajitasyonda huzursuzluk, anksiyete, öfke ve kaygı da vardır; eksitasyonda duygulanıma dair bilgi yoktur."],
["Genel","Bilinç ve yönelim hangi tablolarda bozulur? Hangilerinde “varmış gibi” görünür?","<b>Gerçekten bozulur:</b> deliryum, demans (ve entoksikasyon/yoksunluk). Bunlar tıbbi acildir.<br><b>Bozulmuş gibi görünür:</b> depresyon, bipolar bozukluk, katatonik stupor, akinetik mutizm – hasta kapalı olduğu için muayenede bilinç kapalılığı izlenimi verir. Psikiyatride nörolojideki gibi bilinç kapalılığı yoktur; depresyon veya sanrı düzeyindeki yönelim bozukluğu tıbbi acil değildir."],
["Psikoz & şizofreni","Psikoz ile nevroz arasındaki en önemli fark nedir?","<b>Gerçeği değerlendirme:</b> psikozda bozuktur, nevrozda sağlamdır. Psikotik belirtiler: pozitif (sanrı, varsanı, dezorganize konuşma-davranış, katatoni, ajitasyon), negatif (affekt sığlaşması, aloji, avolüsyon, anhedoni, içe çekilme) ve bilişsel (spontan konuşmayı başlatamama, akıcılık ve dikkat bozukluğu); ayrıca agresif ve depresif belirtiler eşlik edebilir."],
["Genel","Düşünce içeriği bozuklukları ve birbirinden ayrımı?","<b>Obsesyon:</b> girici, tekrarlayıcı, benliğe yabancı; kişi saçma bulur. <b>Sanrı:</b> gerçekte olmayan düşünceyi ısrarla savunma, ikna olmama. <b>Fobi:</b> belirli uyaran/durumda dirençli, mantıksız, aşırı korku ve kaçınma.<br>Depresyonda: intihar düşünceleri, yetersizlik ve değersizlik, suçluluk, geçmişe pişmanlık, geleceğe karamsarlık, umutsuzluk-çaresizlik, somatik yakınmalar."],
["Deliryum & demans","Demans nedir, türleri nelerdir?","Bilinç açıkken ilerleyici, genelde kalıcı bellek ve diğer bilişsel işlev (dil, praksi, yargı, soyutlama) kaybı; günlük yaşamı bozar. Eşlik edebilir: depresyon, sanrı, varsanı, ajitasyon, saldırganlık.<br><b>Türler:</b> Alzheimer, vasküler, Lewy cisimcikli, frontotemporal, Parkinson demansı, Huntington, Creutzfeldt-Jakob, HIV ile ilişkili, alkole bağlı; ayrıca geri dönüşümlü demanslar."],
["Genel","Bayılma yakınmasıyla gelen hastada neler düşünürsünüz?","Önce organik nedenler dışlanır: kardiyak (aritmi, vazovagal, ortostatik hipotansiyon), nörolojik (epilepsi, inme), metabolik (hipoglisemi), ilaç/madde, dehidratasyon, gebelik.<br>Psikiyatrik ayırıcı: <b>konversiyon (psödonöbet/psödosenkop)</b> – stresli olay sonrası, yaralanmasız, güzel aldırmazlık; <b>panik atak</b> (hiperventilasyon); disosiyatif bozukluk; katatonik stupor; simülasyon/yapay bozukluk."],
["Cinsellik & uyku","Uyku bozuklukları nelerdir?","<b>Disomniler:</b> primer insomnia, primer hipersomnia, narkolepsi (uyku atakları, katapleksi, uyku felci), solunumla ilişkili uyku bozukluğu (uyku apnesi), sirkadyen ritim bozukluğu.<br><b>Parasomniler:</b> kabus, <b>gece terörü</b> (NREM), uyurgezerlik. Her uykusuzluğu önce nedeniyle (tıbbi/psikiyatrik/madde) değerlendirmek gerekir."],
["İntihar","Hastada intihar düşüncesi var mı, niteliği nedir? Hangi sorularla araştırırsınız?","Sorulması intiharı tetiklemez; açık ve yargısız sorulur. Genelden özele: “Hiç yaşamak istemediğiniz, ölmeyi düşündüğünüz oldu mu?” → “Kendinize zarar vermeyi düşündünüz mü?” → plan, yöntem, ölümcüllük, ulaşılabilirlik, daha önce girişim, hazırlık (vasiyet, mezar yeri).<br>Düşüncenin ciddiyeti girişim riskinin en önemli göstergesidir; düşünce ~%34 plana, plan ~%72 girişime dönüşür."],
["Anksiyete & nevroz","Travma nedir, sonrasında hangi psikiyatrik tablolar çıkar?","Kişinin yaşamını/bütünlüğünü tehdit eden, aşırı stres yaratan olay (kaza, tecavüz, deprem, yangın, savaş).<br><b>Tablolar:</b> akut stres bozukluğu (≤1 ay), <b>TSSB</b> (yeniden yaşama, kaçınma, aşırı uyarılmışlık), uyum bozukluğu, depresyon, anksiyete bozuklukları, madde kötüye kullanımı, disosiyatif bozukluklar, somatizasyon. Tedavi: SSRI + travma odaklı psikoterapi."],
["Cinsellik & uyku","Toplumda kadın ve erkekte en sık görülen üç cinsel işlev bozukluğu?","<b>Erkekte:</b> prematür ejakülasyon (en sık, ~%30), erektil disfonksiyon, cinsel istek azlığı.<br><b>Kadında:</b> cinsel istek azlığı, orgazm bozukluğu (anorgazmi), uyarılma/lubrikasyon sorunları ve ağrılı cinsel ilişki (disparoni, vajinismus). Sınıflama istek-uyarılma-orgazm-ağrı fazlarına göre yapılır."],
["Farmakoloji","EKT: endikasyon, kontrendikasyon, yan etki?","<b>Endikasyon:</b> ilaca dirençli veya psikotik depresyon, acil müdahale gerektiren tablolar (intihar riski yüksek, yemeyi reddeden, katatoni), dirençli şizofreni/mani.<br><b>Kontrendikasyon:</b> artmış kafa içi basıncı/kitle (mutlak), yakın zamanda MI, ciddi kardiyak/anestezi riskleri, serebral anevrizma.<br><b>Yan etki:</b> geçici bellek bozukluğu, konfüzyon, baş ağrısı, kas ağrısı, anestezi riski. Bilateral daha etkili ama bilişsel yan etkisi fazla."],
["Duygudurum","Yas nedir, depresyondan farkı?","Sevilen birinin kaybına verilen normal tepki: üzüntü, özlem, suçluluk, uyku-iştah değişikliği, geçici varsanı (kaybedeni görme/duyma). Dalgalar halinde gelir, benlik saygısı korunur, zamanla azalır.<br><b>Depresyonda:</b> süreğen çökkünlük, değersizlik, belirgin işlevsellik kaybı, intihar düşüncesi, psikotik özellik. Yas 2 ayı aşar veya ağırlaşırsa depresyon düşünülür; yas gerçeğe uyumun bir parçasıdır."],
["Duygudurum","Depresyon hangi grup bozukluktur? Alt tipleri?","<b>Duygudurum (afektif) bozuklukları</b> grubundadır: tek kutuplu (majör depresyon, distimi) ve iki kutuplu (bipolar I-II, siklotimi). Majör depresyon tek atak/tekrarlayıcı olabilir; melankolik, atipik, psikotik özellikli alt tipleri vardır."],
["Duygudurum","Depresyonu kim, nerede tedavi etmeli? Tedavi ilkeleri?","Hafif-orta: aile hekimi/psikiyatrist ayaktan; <b>yatış:</b> intihar riski, psikotik özellik, yeme-içmeyi reddetme, işlevsel çöküş, destek yokluğu.<br>Antidepresan yanıtı 3–6 haftada gelir (yan etkiler hemen), yanıt = ≥%50 düzelme; hastaların ~2/3’ü yanıt verir. İyileşmeden sonra en az 6 ay, tercihen 1 yıl devam. Direnç: ikinci antidepresan, lityum/atipik AP ile güçlendirme, T3, EKT. Psikoterapi (BDT, interpersonel) eklenir."],
["Farmakoloji","Antidepresanlar etki mekanizmalarına göre sınıflaması?","<b>MAO inhibitörleri:</b> moklobemid (MAO-A, geri dönüşümlü). <b>Trisiklikler:</b> imipramin, amitriptilin, klomipramin (5-HT+NA geri alım↓). <b>SSRI:</b> serotonin. <b>SNRI:</b> venlafaksin, duloksetin. <b>NASSA:</b> mirtazapin (α2 blokajı). <b>SARI:</b> trazodon (5-HT2 blokajı + hafif geri alım). Ayrıca bupropion (DA-NA), reboksetin (NA), agomelatin (melatonin/5-HT2C)."],
["Farmakoloji","MAOI, TCA ve SSRI’ların başlıca yan etkileri?","<b>MAOI:</b> hipertansif kriz (tiramin içeren peynir, şarap; serotonerjik ilaçlarla etkileşim), ortostatik hipotansiyon.<br><b>TCA:</b> antikolinerjik (ağız kuruluğu, kabızlık, retansiyon, bulanık görme), antihistaminik (sedasyon, kilo), α1 (ortostatik hipotansiyon), kardiyotoksisite (QRS/QT), nöbet eşiği↓, doz aşımında ölümcül.<br><b>SSRI:</b> bulantı, ajitasyon, uykusuzluk, cinsel işlev bozukluğu, hiponatremi, serotonin sendromu. Ani kesilmede (TCA, venlafaksin, paroksetin) kesilme belirtileri."],
["Duygudurum","Bipolar bozukluk: prognoz ve tedavideki zorluklar?","Tekrarlayıcı seyirlidir; atak sayısı arttıkça aralık kısalır. Yineleme riski yüksek, çoğu hasta ömür boyu profilaksi gerektirir.<br><b>Zorluklar:</b> hastalık içgörüsünün olmaması, tedaviye uyumsuzluk, depresyondan maniye kayma (antidepresanla), lityumun dar terapötik aralığı, kan düzeyi takibi, yan etkiler, eşlik eden madde kullanımı, intihar riski (yüksek). Sürekli takip, psikoeğitim ve uyku düzeni gerekir."],
["Genel","Genel tıbbi duruma bağlı psikiyatrik bozukluk ne demektir?","Psikiyatrik belirtilerin doğrudan fizyolojik bir hastalığın sonucu olması: hipo/hipertiroidi, Cushing, SLE, Parkinson, MS, tümör, epilepsi, enfeksiyon, B12 eksikliği vb. Ruhsal bozukluk olarak ele alınır ama tedavinin temeli altta yatan hastalığı bulup düzeltmektir. Yeni başlayan, atipik, yaşlılıkta ortaya çıkan, tedaviye yanıtsız psikiyatrik tabloda mutlaka düşünülmeli."],
["Acil & kriz","Kriz nedir, evreleri ve müdahale?","Kişinin başa çıkma yetisini aşan, dengeyi bozan stresli duruma verdiği geçici tepkidir (genelde 4–6 hafta). Evreler: uyarı/çatışma, başa çıkma çabası ve tırmanma, çaresizlik-dağılma.<br><b>Müdahale:</b> kısa, odaklı, şimdiye yönelik; ilişki kur, sorunu tanımla, duygu boşalımına izin ver, alternatif başa çıkma yolları, sosyal destek, risk (intihar/şiddet) değerlendirmesi, gerekirse ilaç ve yönlendirme."],
["Genel","Ergenlik dönemi evreleri ve özellikleri?","<b>Erken (10–13):</b> bedensel değişim, beden imajı kaygısı, ebeveynden uzaklaşma, akran önemi. <b>Orta (14–16):</b> özerklik çatışması, akran baskısı, risk alma, kimlik arayışı, cinsellik. <b>Geç (17–20):</b> kimlik oturur, meslek ve değer belirlenir, yakın ilişki. Bu dönemde depresyon, yeme bozukluğu, madde, davranım sorunları ve psikoz başlangıcı sık görülür."],
["Anksiyete & nevroz","Somatizasyon bozukluğu nedir?","Somatoform bozukluktur: 30 yaşından önce başlayan, yıllara yayılan, çok sistemi (ağrı, GİS, cinsel, psödonörolojik) tutan çoklu yakınmalar; tıbbi açıklama yok, hasta sürekli doktor değiştirir. Kadında sık. Tedavi: tek bir güvenilir hekim, düzenli randevu, gereksiz tetkikten kaçınma, psikoterapi, eşlik eden depresyon/anksiyete tedavisi."],
["Farmakoloji","Klasik (tipik) antipsikotikler: jenerik ve ticari adları?","Klorpromazin (LARGACTIL), trifluoperazin (STILIZAN), flufenazin (PROLIXIN), haloperidol (NORODOL), pimozid (NOROFREN), zuklopentiksol (CLOPIXOL), flupentiksol (FLUANXOL), sülpirid (DOGMATIL).<br>Düşük potensli (klorpromazin): EPS az, antikolinerjik/antihistaminik/antiadrenerjik yan etki çok. Yüksek potensli (haloperidol): D2 afinitesi yüksek, EPS çok."],
["Farmakoloji","Atipik antipsikotikler: jenerik ve ticari adları?","Klozapin (LEPONEX), risperidon (RISPERDAL, uzun etkili CONSTA), paliperidon (INVEGA; XEPLION, TREVICTA), olanzapin (ZYPREXA), ketiyapin (SEROQUEL), ziprasidon (ZELDOX), aripiprazol (ABILIFY; MAINTENA), amisülprid (SOLIAN), sertindol (SERDOLECT).<br>Serotonin-dopamin antagonisti; EPS az, metabolik yan etkiler önemli."],
["Kişilik","Kişilik bozukluğu nedir, kümeleri?","Esnek olmayan, uyumsuz, süreğen ve kişinin sıkıntı/işlev kaybı yaratan davranış-düşünce örüntüsü; ergenlik/erken erişkinlikte başlar.<br><b>A (garip-eksantrik):</b> paranoid, şizoid, şizotipal. <b>B (dramatik-duygusal):</b> antisosyal, borderline, histrionik, narsistik. <b>C (kaygılı):</b> kaçıngan, bağımlı, obsesif-kompulsif. Borderline’da yansıtma, bölme (splitting), yansıtmalı özdeşleşme, inkâr kullanılır."],
["Genel","Amenore hangi psikiyatrik durumlarda görülür?","<b>Anoreksiya nervoza</b> (düşük kilo, LH/FSH↓) ve ilaç yan etkisi olarak (antipsikotik, bazı antidepresanlar – hiperprolaktinemi). Ayrıca aşırı stres/depresyon ve bulimiada adet düzensizliği olabilir."],
["Psikoz & şizofreni","Şizofrenide aday genler, genetik çalışmalar?","Aday genler: DTNBP1 (6p), NRG1 (8p), DISC1 (1q), DAOA (13q), COMT (22q). Yöntemler: genom çapında ilişkilendirme (GWAS), kalıtsal çalışmalar. ZNF804A: taşıyıcılarda dorsolateral prefrontal korteks–hipokampüs bağlantısı anormal. 22q11.2 mikrodelesyonu (DiGeorge) ~%25’e kadar şizofreni riski taşır."],
["Cinsellik & uyku","Cinsel işlev bozukluğu olan kadında öykü alırken nelere dikkat edersiniz?","Yargısız ol, genelden özele git (“Cinsel hayatınızla ilgili sorun yaşıyor musunuz?”), hastanın sosyokültürel düzeyine göre konuş. Sor: ne zaman başladı, nasıl ilerledi, her zaman mı, her partnerle mi yoksa belli bir partnerle mi, manuel stimülasyonla orgazm oluyor mu.<br><b>Anorgazmi:</b> ilk deneyimde ise normal; klitoral uyarımla/köprü tekniğiyle orgazm oluyorsa anorgazmi denmez; partnerde prematür ejakülasyon var mı?"],
["Cinsellik & uyku","PE ve erektil disfonksiyonda davranışçı teknikler?","<b>PE:</b> çiftte iletişim, durdur-başla (stop-start), sıkma (squeeze), duyu odaklanma, lubrikan krem, deneysel tutumun desteklenmesi.<br><b>Erektil disfonksiyon:</b> duyu odaklanma (hassas bölgelere odaklanma) ve <b>ilişki yasağı</b> (performans kaygısını kırar)."],
["Psikodinamik & terapi","Sosyal beceri eğitimi nedir?","Destekleyici psikoterapidir: günlük yaşam ve kişiler arası iletişim becerilerini kazandırır. Ağır ruhsal bozukluğu (şizofreni) olan, sosyal becerileri belirgin bozuk hastada uzun dönemli kullanılır; serviste başlar, taburculuk sonrası günlük yaşamla baş etmede yardımcı olur. Çok ağır hastada temel kişisel bakımdan başlanır."],
["Olgu","OLGU 1 – Menopoz sonrası uykusuzluk (54 K) / gündüz uyuyup yorgun genç (21)","<b>Ön tanı:</b> insomnia; sekonder neden aranır (özellikle <b>huzursuz bacak sendromu</b>).<br><b>İnsomnia:</b> uykuya dalmada güçlük, sürdürememe, sık veya erken uyanma, dinlendirmeyen uyku + gündüz işlev kaybı. Akut: <1 ay; kronik: haftada ≥3 gece, uzun süreli (≥3 ay).<br><b>Tıbbi nedenler:</b> huzursuz bacak (demir eksikliği, böbrek yetmezliği, gebelik), uyku apnesi, hipertiroidi, ağrı, depresyon/anksiyete/bipolar. <b>İlaçlar:</b> SSRI/SNRI, kortikosteroid, β-bloker, <b>psikostimülanlar</b> (metilfenidat, amfetamin: MSS’yi uyarır, uyanıklık ve enerjiyi artırır).<br><b>Tedavi:</b> önce neden (huzursuz bacakta demir replasmanı, dopamin agonisti pramipeksol/ropinirol). Sonra uyku hijyeni; olmazsa kısa süreli zopiklon/zolpidem veya BZD, difenhidramin/doksilamin.<br><b>Uyku hijyeni:</b> aynı saatte yat-kalk, yatak sadece uyku/cinsellik için, oda karanlık-sessiz-serin, yatmadan önce kafein-nikotin-alkol-ağır yemek yok, gündüz uykusundan ve akşam egzersizinden kaçın, uyku gelmeden yatma."],
["Olgu","OLGU 2 – 8 kez rinoplasti geçiren, hâlâ memnun olmayan hasta","<b>Tanı: beden dismorfik bozukluğu (BDB).</b> Gerçekte olmayan veya çok küçük bir kusura aşırı takılma.<br><b>Yaklaşım:</b> empatik ol, şikâyeti ciddiye al ama “gerçekten kusur var” diye onaylama; gereksiz ameliyattan koru, psikiyatrik tedaviye yönlendir. Ameliyat sonrası <b>memnun kalmaz</b>, çünkü sorun anatomik değil algı/nörobiyolojik süreçtedir.<br><b>Ayırıcı tanı:</b> OKB, sosyal anksiyete bozukluğu, depresyon, anoreksiya nervoza (beden algısı), sanrısal bozukluk (somatik tip).<br><b>Tedavi:</b> <b>SSRI</b> (OKB’dekine benzer yüksek dozda) + <b>BDT</b> (maruz bırakma ve tepki önleme); dirençte atipik antipsikotikle güçlendirme."],
["Olgu","OLGU 3 – Amenore ve hızlı kilo kaybı (genç kadın)","<b>Ön tanı: anoreksiya nervoza.</b><br><b>Bulgular:</b> amenore, LH-FSH↓, zayıflık/kaşeksi, lanugo, bradikardi-hipotansiyon, hipotermi, QT uzaması, hiponatremi-hipokalemi, lökopeni, anemi, osteoporoz; aşırı egzersiz, kusma, laksatif.<br><b>Ayırıcı:</b> bulimia nervoza, majör depresyon, kanser/GİS/endokrin hastalıklar, şizofreni, sosyal fobi.<br><b>Acil:</b> EKG, elektrolit, vital bulgular. Kalp hızı <40, tansiyon <80/50, ısı <36, ciddi elektrolit bozukluğu → dahiliyeye/yoğun bakıma yatış. Beslenmeye <b>yavaş</b> başla (refeeding sendromu: hipofosfatemi), tiamin ver.<br><b>Tedavi:</b> beslenme rehabilitasyonu, BDT, aile terapisi, kilo desteği ve anksiyete için olanzapin."],
["Olgu","OLGU 4 – Sabah 5’te kalkıp hazırlanamayan, okula geç kalan çocuk","<b>Tanı: OKB.</b><br><b>Obsesyon:</b> istenmeden zihne giren, benliğe yabancı, anksiyete yaratan düşünce/dürtü. <b>Kompulsiyon:</b> anksiyeteyi azaltmak için yapılan tekrarlayıcı davranış/zihinsel eylem.<br><b>Kompulsiyon örnekleri:</b> yıkama-temizlik, kontrol etme (kapı, ocak, çanta), düzenleme-simetri, saymak, tekrarlama, dua/içinden sayı sayma, biriktirme, dokunma.<br><b>Tanı:</b> obsesyon ve/veya kompulsiyon; günde >1 saat sürer veya belirgin sıkıntı/işlev kaybı; madde/tıbbi duruma bağlı değil. İçgörü iyi/kötü/yok olarak belirtilir. Çeşitleri tematik: bulaşma-temizlik, kontrol, zarar verme, simetri-düzen, dini-cinsel."],
["Olgu","OLGU 5 – 70 yaşında, bir yıldır artan unutkanlık","<b>İlk düşünülen: Alzheimer.</b> Sinsi, ilerleyici, yakın bellek bozukluğu ön planda.<br><b>Tipler:</b> <b>Vasküler:</b> ani başlangıç, basamak basamak, fokal nörolojik bulgu. <b>Lewy:</b> dalgalı bilinç, canlı görsel varsanı, parkinsonizm. <b>Frontotemporal:</b> kişilik-davranış değişikliği, dezinhibisyon, apati, dil bozukluğu, frontotemporal atrofi.<br><b>Ayırıcı:</b> psikiyatrik: majör depresyon (psödodemans), deliryum. Tıbbi: hipotiroidi, B12 eksikliği, NPH, beyin tümörü, nörosifiliz, ilaçlar (antikolinerjik, BZD).<br><b>Alzheimer – psödodemans:</b> Alzheimer sinsi başlar, hasta unutkanlığını inkâr eder/umursamaz; psödodemans daha akut başlar, hasta kendi gelir ve unutkanlığını abartır, sorulara “bilmiyorum” der, depresiftir ve antidepresana yanıt verir."],
["Olgu","OLGU 6 – Şizofreni hastasında WBC 1400/mm³","<b>İlaç: klozapin</b> (agranülositoz/nötropeni). WBC<3000 veya mutlak nötrofil <1500 uyarı; bu hastada ilaç kesilir, hematoloji ile izlenir (G-CSF).<br><b>Diğer ciddi yan etkiler:</b> metabolik sendrom (kilo, diyabet, dislipidemi), sedasyon, hipersalivasyon, nöbet eşiğinin düşmesi, ortostatik hipotansiyon/taşikardi.<br><b>Ölümcül kalp yan etkisi:</b> <b>miyokardit</b> (ve kardiyomiyopati). Ayrıca <b>paralitik ileus</b> yapabilir."],
["Olgu","OLGU 7 – Bulantı, kusma, ateş, terleme ile gelen bipolar hasta","<b>İlk düşünülen: lityum entoksikasyonu.</b><br><b>Belirtiler:</b> hafif: bulantı, kusma, ishal, ince tremor, halsizlik; orta: kaba tremor, ataksi, dizartri, konfüzyon; şiddetli: koma, nöbet, aritmi (T dalgası düzleşmesi), böbrek yetmezliği.<br><b>Düzey:</b> terapötik 0,6–1,2 mEq/L (akut mani 0,8–1,2; idame 0,6–0,8); >1,5 toksik.<br><b>Böbrek:</b> nefrojenik diabetes insipidus (poliüri, polidipsi), idrar yoğunlaştırma bozukluğu, kronik kullanımda GFR↓.<br><b>Tedavi:</b> lityumu kes, IV sıvı-elektrolit; ciddi entoksikasyonda <b>hemodiyaliz</b>."],
["Olgu","OLGU 8 – Tıkınırcasına yeme, kilo dalgalanması, kusma (34 K)","<b>Ön tanı: bulimia nervoza</b> (normal kilo, tıkınma + telafi, depresyon öyküsü).<br><b>Fizik bulgu:</b> el sırtında <b>Russell bulgusu</b> (kusmaya bağlı nasır), diş erozyonu, parotis şişliği.<br><b>Nörolojik ayırıcı:</b> Kleine-Levin sendromu (hipersomni + aşırı yeme), Klüver-Bucy sendromu, hipotalamik/frontal lezyonlar, temporal lob epilepsisi, frontotemporal demans.<br><b>Laboratuvar:</b> hipokalemi (aritmi riski), hipokloremi, hipomagnezemi, metabolik alkaloz (H⁺ kaybı), dehidratasyon, BUN artışı."],
["Olgu","OLGU 9 – Yatışta taşikardi, HT, konfüzyon gelişen alkolik","<b>Tanı: alkol yoksunluğu, nöbet veya deliryum tremens.</b><br>Mekanizma: alkol GABA’yı artırır, glutamatı baskılar; kesilince glutamat↑ ve sempatik aşırı uyarılma. Klinik: konfüzyon, dezoryantasyon, görsel varsanılar, otonomik hiperaktivite, tremor, nöbet.<br><b>Acil:</b> önce <b>hayati bulgular stabilize edilir (monitör, taşikardi/HT kontrolü)</b>; sıvı-elektrolit, <b>IV tiamin</b> (glukozdan önce, Wernicke’yi önler), IV diazepam/lorazepam.<br><b>Dışlanacak tıbbi durumlar:</b> hipoglisemi, Wernicke-Korsakoff, hipokalemi/hipomagnezemi, hepatik ensefalopati, GİS kanama, pankreatit, enfeksiyon/pnömoni, kafa travması (subdural hematom)."],
["Olgu","OLGU 10 – “Üzerimde böcekler geziyor” diyen, kendi kendine konuşan hasta","<b>Taktil (haptik) varsanı</b> → önce <b>stimülan (kokain, amfetamin) entoksikasyonu</b> ve <b>alkol yoksunluğu/DT</b> düşünülür.<br><b>Ayırıcı:</b> psikiyatrik: şizofreni, şizofreniform, bipolar psikotik; tıbbi: MSS enfeksiyonu, kafa travması, epilepsi, antikolinerjik toksisite, madde/alkol-opioid yoksunluğu.<br><b>Acil:</b> güvenli ortam, vital bulgular (ateş, taşikardi, HT, midriyazis → stimülan), glukoz, idrar toksikolojisi, laboratuvar. Sakinleştirmek için kısa etkili BZD (diazepam/lorazepam) ± düşük doz antipsikotik (haloperidol)."],
["Olgu","OLGU 11 – Antipsikotik sonrası boyun kasılması / memeden süt gelmesi","<b>Boyun kasılması + göz yukarı kayması: akut distoni.</b> Diğer EPS: akatizi, parkinsonizm (tremor, rijidite, bradikinezi); geç: tardif diskinezi.<br><b>Mekanizma:</b> nigrostriatal yolakta <b>D2 reseptör antagonizması</b>. Tipik antipsikotikler (yüksek D2 afinitesi) daha çok EPS yapar. Tedavi: IM biperiden (akineton) ± difenhidramin; akatizide propranolol.<br><b>Memeden süt:</b> hiperprolaktinemi → <b>tuberoinfundibular</b> yolakta D2 blokajı. Kadında galaktore, amenore, libido↓; erkekte libido↓, jinekomasti, erektil disfonksiyon; uzun sürede osteoporoz, infertilite."],
["Olgu","OLGU 12 – Tutulmuş, konuşmayan, kendi kendine gülen genç","<b>Katatoni:</b> stupor, mutizm, balmumu esnekliği, negativizm, postür, stereotipi, ekolali-ekopraksi, eksitasyon.<br><b>Etiyoloji:</b> şizofreni, duygudurum bozuklukları (mani/depresyon), organik (ensefalit, epilepsi, metabolik), ilaç (NMS), madde.<br><b>Acil tedavi:</b> <b>lorazepam</b> (1–2 mg IV/IM, tekrarlanır); yanıt yoksa <b>EKT</b>. Antipsikotik NMS riski nedeniyle dikkatle; hidrasyon, beslenme, derin ven trombozu önlemi."],
["Olgu","OLGU 13 – İntihar girişimi (silah / çok sayıda ilaç)","<b>Akut:</b> ABC stabilizasyonu, monitör; ilaçsa mide yıkama/aktif kömür, spesifik antidot (parasetamolde N-asetilsistein, BZD’de flumazenil, opioidde naloksan), yoğun bakım; stabil olunca psikiyatrik değerlendirme ve yatış.<br><b>Risk faktörleri:</b> sosyodemografik: erkek, ergen/yaşlı, dul-boşanmış, yalnız yaşama, işsizlik, ekonomik sorun, silah erişimi. Klinik: depresyon, şizofreni, alkol-madde, borderline/antisosyal KB, kronik hastalık, umutsuzluk, önceki girişim, aile öyküsü, planın ciddiyeti.<br><b>Koruyucu:</b> aile-sosyal destek, gebelik, çocuk sahibi olma, <b>dini inanç</b>, intihara karşı kültür, baş etme becerisi, tedaviye erişim."],
["Olgu","OLGU 14 – Uykusuz, enerjik, çok konuşan 25 yaşında hasta","<b>Ön tanı: bipolar bozukluk, manik dönem.</b><br><b>Akut tedavi:</b> yatış gerekebilir; duygudurum düzenleyici (lityum, valproat) ± atipik antipsikotik (olanzapin, risperidon, ketiyapin), gerekirse BZD; antidepresan kesilir, uyku düzeni ve uyarandan uzak ortam.<br><b>Eksite/saldırgan hasta:</b> IM kokteyl: klorpromazin 25 mg + haloperidol 5 mg + biperiden 5 mg (yarım saatte etki); lorazepam; birkaç gün sedasyon için Clopixol Acuphase; gerekirse tespit (yalnız bırakma, solunum-dolaşım izle)."],
["Olgu","OLGU 15 – Topluluk önünde aşırı korku, kaçınma (34 K)","<b>Sosyal fobi (sosyal anksiyete bozukluğu).</b><br><b>Ayırıcı:</b> panik bozukluk/agorafobi, çekingen (kaçıngan) kişilik bozukluğu, GAB, depresyon, şizofreni, madde etkisi, normal utangaçlık/performans kaygısı.<br><b>Tedavi basamakları:</b> psikoeğitim → <b>SSRI</b> (paroksetin, sertralin, essitalopram) veya venlafaksin ve <b>BDT</b> (maruz bırakma, bilişsel yeniden yapılandırma, sosyal beceri). Performans korkusunda sınavdan/sunumdan önce propranolol; direnç durumunda alternatif ilaç, kısa süreli BZD/klonazepam."],
["Olgu","OLGU 16 – Okulu yakan, kavgacı 16 yaşında çocuk","<b>Ön tanı: davranım bozukluğu</b> (kurallara ve başkalarının haklarına tekrarlayan saldırı: kavga, mala zarar, kaçma).<br>18 yaşından sonra bu tablo <b>antisosyal kişilik bozukluğuna</b> evrilebilir. Ayırıcı: DEHB, duygudurum bozukluğu, madde kullanımı, karşıt olma-karşı gelme. Tedavi: aile-davranış temelli müdahale, BDT; agresyon için gerekirse atipik antipsikotik."],
["Olgu","OLGU 17 – Çarpıntı, nefes alamama, ölüm korkusu; organik neden yok","<b>Akut panik atak:</b> organik neden dışlanır, hasta sakinleştirilir, yavaş diyafram solunumu öğretilir; gerekirse lorazepam/diazepam. İdame: SSRI (± kısa süreli BZD) + BDT.<br><b>Panik atak vs panik bozukluk:</b> atak ani başlar, ~10 dk’da zirve, ≥4 somatik/bilişsel belirti ve yoğun korku; herhangi bir tanıda olabilir. Panik bozukluk: <b>tekrarlayan beklenmedik ataklar</b> + en az 1 ay süren beklenti anksiyetesi, atağın sonuçları kaygısı veya davranış değişikliği (agorafobi)."]
];
